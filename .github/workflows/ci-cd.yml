name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run quality gate and tests
        run: |
          python check_quality.py
          python -m pytest 

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t movie-api .

      - name: Test Docker container startup
        run: |
          docker run -d -p 8000:8000 --name movie-container movie-api
          # Petite pause pour laisser le temps à l'API de démarrer
          sleep 5
          # Vérification que le conteneur tourne toujours
          docker ps | grep movie-container