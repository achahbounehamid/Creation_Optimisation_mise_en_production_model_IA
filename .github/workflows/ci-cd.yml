name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run quality gate and tests
        run: |
          python check_quality.py
          python -m pytest 

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t movie-api .

      - name: Test Docker container startup
        run: |
          docker run -d -p 8000:8000 --name movie-container movie-api
          # Petite pause pour laisser le temps à l'API de démarrer
          sleep 5
          # Vérification que le conteneur tourne toujours
          docker ps | grep movie-container

  publier:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connexion à Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build et Push de l'image vers ACR
        run: |
          # Construction de l'image Docker
          docker build -t ${{ secrets.ACR_REGISTRY }}/movie-api:${{ github.sha }} .
          docker tag ${{ secrets.ACR_REGISTRY }}/movie-api:${{ github.sha }} ${{ secrets.ACR_REGISTRY }}/movie-api:latest
          
          # Envoi des images vers Azure
          docker push ${{ secrets.ACR_REGISTRY }}/movie-api:${{ github.sha }}
          docker push ${{ secrets.ACR_REGISTRY }}/movie-api:latest